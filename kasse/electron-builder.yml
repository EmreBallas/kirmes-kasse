# Packaging der Kasse: Ordner-Deploy nach C:\Kasse (dist/win-unpacked) plus Zip, kein Installer, kein Signing.
appId: ch.kibw.kasse
productName: Kasse
copyright: KIBW Winterthur
directories:
  buildResources: build
  output: dist
asar: true
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{data,data-e2e,dist,docs,tools,resources,build}/**'
  - '!seed.local.json'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,KONTRAKT.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
# Migrationen, PowerShell-Skripte und Seeds liegen ausserhalb des asar unter <App>/resources/...
extraResources:
  - from: src/server/migrations
    to: migrations
  - from: tools
    to: tools
  - from: resources
    to: resources
win:
  target:
    - dir
    - zip
  executableName: Kasse
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win.${ext}
forceCodeSigning: false
npmRebuild: false
